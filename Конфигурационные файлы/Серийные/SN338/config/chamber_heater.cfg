#####################################################################
#                    Нагреватель камеры
#####################################################################

[heater_generic chamber_heater]
heater_pin: PF7
sensor_type: EPCOS 100K B57560G104F # Тип датчика температуры
sensor_pin: PC4                     # PIN датчика температуры
control: watermark
max_power: 0.5                     # Максимальная мощность, которую можно подать на нагреватель. 1 соответствует 100% мощности
min_temp: 0                       # Минимальная температура нагревателя. Если температура опуститься ниже данного значения, система выдаст ошибку.
max_temp: 85                       # Максимальная температура нагревателя. Если температура превысит данное значения, система выдаст ошибку.

[verify_heater chamber_heater] 
max_error: 9999999999
check_gain_time:9999999999
hysteresis: 9999999999
heating_gain: 9999999999


[gcode_macro M141]
description = Установить температуру камеры (без ожидания)
gcode:
    {% set s = params.S|default(0)|float %}
    SET_CHAMBER_TEMP CHAMBER={s}

[gcode_macro M191]
description = Установить температуру камеры и ждать достижения
gcode:
    {% set s = params.S|default(0)|float %}
    SET_CHAMBER_TEMP CHAMBER={s}
    {% if s > 0 %}
        TEMPERATURE_WAIT SENSOR=chamber_heater MINIMUM={s-1} MAXIMUM={s+1}
    {% endif %}

[temperature_sensor PTC]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB0
min_temp: 0
max_temp: 150


[temperature_fan _PTC]
pin: PF6                            
max_power: 1                        
shutdown_speed: 0.0                 
kick_start_time: 5.0                
sensor_type: EPCOS 100K B57560G104F   
sensor_pin: PC1                       
min_temp: -1                        
max_temp: 150                       
target_temp: 60                     
control: watermark


[gcode_macro SET_CHAMBER_TEMP]
description = Установка режима управления камерой (1: <40, 2: 40-50, 3: >=50)
variable_target_temp = 0
variable_mode = 1
gcode = 
    {% set target = params.CHAMBER|default(0)|float %}
    
    {% if target > 80 %}
        {action_respond_info("[Инфо] Запрошенная температура %.1fC превысила безопасный лимит 80C. Команда проигнорирована." % target)}
    {% else %}
        SET_GCODE_VARIABLE MACRO=SET_CHAMBER_TEMP VARIABLE=target_temp VALUE={target}

        {% if target < 40 %}
            SET_GCODE_VARIABLE MACRO=SET_CHAMBER_TEMP VARIABLE=mode VALUE=1
            {action_respond_info("[Режим 1] <40C: Вытяжка + Апертура. Цель: %.1fC" % target)}
        {% elif target < 50 %}
            SET_GCODE_VARIABLE MACRO=SET_CHAMBER_TEMP VARIABLE=mode VALUE=2
            {action_respond_info("[Режим 2] 40-50C: Управление BedFan. Цель: %.1fC" % target)}
        {% else %}
            SET_GCODE_VARIABLE MACRO=SET_CHAMBER_TEMP VARIABLE=mode VALUE=3
            {action_respond_info("[Режим 3] >=50C: BedFan + Chamber Heater. Цель: %.1fC" % target)}
        {% endif %}

        # Применяем настройки НЕМЕДЛЕННО, чтобы нагрев начался без задержки
        {% set current = printer["heater_generic chamber_heater"].temperature|default(0)|float %}
        {% if target >= 50 %}
            SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={target}
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=BedFan TARGET={10 if current < target else 120}
            APERTURE STATE=CLOSE
            SET_FAN_SPEED FAN=Exhaust SPEED=0
        {% elif target >= 40 %}
            SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=BedFan TARGET={10 if current < target else 120}
            APERTURE STATE=CLOSE
            SET_FAN_SPEED FAN=Exhaust SPEED=0
        {% else %}
            SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=BedFan TARGET=0
            APERTURE STATE=OPEN
            SET_FAN_SPEED FAN=Exhaust SPEED=1.0
        {% endif %}

        # Запускаем цикл для дальнейшей подстройки (убран дубль, который ставил задержку)
        UPDATE_DELAYED_GCODE ID=_CHAMBER_MONITOR DURATION=10
    {% endif %}

[delayed_gcode _CHAMBER_MONITOR]
gcode = 
    {% set target = printer['gcode_macro SET_CHAMBER_TEMP'].target_temp|float %}
    {% set mode = printer['gcode_macro SET_CHAMBER_TEMP'].mode|int %}
    {% set current = printer["heater_generic chamber_heater"].temperature|default(0)|float %}
    {% set hyst = 2.0 %}

    {% set exhaust_speed = 0 %}
    {% set aperture = "CLOSE" %}
    {% set bedfan_target = 0 %}
    {% set heater_target = 0 %}

    {% if mode == 1 %}
        {% set aperture = "OPEN" %}
        {% set bedfan_target = 0 %}
        {% set heater_target = 0 %}
        {% if current > target + hyst %}
            {% set exhaust_speed = 1.0 %}
        {% elif current < target %}
            {% set exhaust_speed = 0.0 %}
        {% endif %}

    {% elif mode == 2 %}
        {% set aperture = "CLOSE" %}
        {% set exhaust_speed = 0.0 %}
        {% set heater_target = 0 %}
        {% if current < target %}
            {% set bedfan_target = 10 %}
        {% elif current > target + hyst %}
            {% set bedfan_target = 120 %}
        {% endif %}

    {% elif mode == 3 %}
        {% set aperture = "CLOSE" %}
        {% set exhaust_speed = 0.0 %}
        {% set heater_target = target %}
        {% if current < target%}
            {% set bedfan_target = 10 %}
        {% elif current > target + hyst %}
            {% set bedfan_target = 120 %}
        {% endif %}
    {% endif %}

    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={heater_target}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=BedFan TARGET={bedfan_target}
    SET_FAN_SPEED FAN=Exhaust SPEED={exhaust_speed}
    APERTURE STATE={aperture}

    UPDATE_DELAYED_GCODE ID=_CHAMBER_MONITOR DURATION=10

[gcode_macro CHAMBER_STATUS]
description = Вывести текущий статус управления камерой
gcode = 
    {% set cfg = printer['gcode_macro SET_CHAMBER_TEMP'] %}
    {% set cur = printer['heater_generic chamber_heater'].temperature|default(0)|float %}
    {% set bf_target = printer['temperature_fan BedFan Fan'].target|default(0)|float %}
    {% set ex_spd = printer['fan_generic Exhaust'].speed|default(0)|float * 100 %}
    {% set servo = printer['servo aperture'].angle|default(180)|float %}
    {% set ap_st = "Open" if servo < 90 else "Closed" %}
    {% if cfg.mode == 1 %} {% set m_name = "[Режим 1]" %}
    {% elif cfg.mode == 2 %} {% set m_name = "[Режим 2]" %}
    {% else %} {% set m_name = "[Режим 3]" %}
    {% endif %}
    {action_respond_info("%s | Current: %.1fC | Target: %.1fC | BedFan: %.0fC | Exhaust: %.0f%% | Aperture: %s" % 
        (m_name, cur, cfg.target_temp, bf_target, ex_spd, ap_st))}

[gcode_macro STOP_CHAMBER_CONTROL]
description = Остановить управление температурой камеры
gcode = 
    # Отменяем запланированный запуск цикла
    UPDATE_DELAYED_GCODE ID=_CHAMBER_MONITOR DURATION=0
    
    # Выключаем оборудование
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=BedFan TARGET=0
    SET_FAN_SPEED FAN=Exhaust SPEED=0
    APERTURE STATE=CLOSE
    
    # Сбрасываем переменные макроса
    SET_GCODE_VARIABLE MACRO=SET_CHAMBER_TEMP VARIABLE=target_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=SET_CHAMBER_TEMP VARIABLE=mode VALUE=0
    
    {action_respond_info("[Управление камерой] Остановлено. Все устройства выключены.")}